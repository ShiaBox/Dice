name: CMake

on: [push, pull_request]

jobs:
  build-windows:
    env:
      BUILD_TYPE: Release
      VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
    strategy:
      fail-fast: false
      matrix:
        include:
        - type: Win32
          triplet: x86-windows-static
          triplet_prefix: x86-windows
          mono: ''
          dll_sfx: windows.i386
        - type: x64
          triplet: x64-windows-static
          triplet_prefix: x64-windows
          mono: ''
          dll_sfx: windows.amd64
          
    runs-on: windows-2022
    
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'

    - name: Create Build Environment
      # Some projects don't allow in-source building, so create a separate build directory
      # We'll use this as our working directory for all subsequent commands
      run: cmake -E make_directory ${{github.workspace}}/build
      
    - name: Cache
      uses: actions/cache@v3
      id: cache
      with:
        # A list of files, directories, and wildcard patterns to cache and restore
        path: ${{github.workspace}}\vcpkg\vcpkg.exe
        # An explicit key for restoring and saving the cache
        key: ${{ runner.os }}-${{ matrix.triplet }}-20231006
        restore-keys:  ${{ runner.os }}-${{ matrix.triplet }}-20231006

    - name: Setup Vcpkg
      shell: cmd
      if: steps.cache.outputs.cache-hit != 'true'
      working-directory: ${{github.workspace}}/vcpkg
      run: bootstrap-vcpkg.bat

    - name: 'Setup NuGet Credentials'
      shell: 'bash'
      # Replace <OWNER> with your organization name
      run: >
        ${{ matrix.mono }} `./vcpkg/vcpkg fetch nuget | tail -n 1`
        sources add
        -source "https://nuget.pkg.github.com/Dice-Developer-Team/index.json"
        -storepasswordincleartext
        -name "GitHub"
        -username "Dice-Developer-Team"
        -password "${{ secrets.GITHUB_TOKEN }}"

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      # Note the current convention is to use the -S and -B options here to specify source 
      # and build directories, but this is only available with CMake 3.13 and higher.  
      # The CMake binaries on the Github Actions machines are (as of this writing) 3.12
      run: cmake $GITHUB_WORKSPACE -A ${{ matrix.type }} -DCMAKE_BUILD_TYPE=$BUILD_TYPE -DDLL_SUFFIX=.${{matrix.dll_sfx}} -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }}

    - name: Build
      shell: bash
      working-directory: ${{github.workspace}}/build
      # Execute the build.  You can specify a specific target with "--target <NAME>"
      run: cmake --build . --config $BUILD_TYPE

    - name: Test
      shell: bash
      working-directory: ${{github.workspace}}/build
      # Execute tests defined by the CMake configuration.  
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest -C $BUILD_TYPE
      
    - name: Upload
      uses: actions/upload-artifact@v4
      with:
        # Artifact name
        name: ${{ matrix.triplet }}
        # A file, directory or wildcard pattern that describes what to upload
        path: "**/w4123.Dice.${{ matrix.dll_sfx }}.dll"


  build-linux:
    env:
      BUILD_TYPE: Release
      VCPKG_BINARY_SOURCES: 'clear;nuget,GitHub,readwrite'
    strategy:
      fail-fast: false
      matrix:
        include:
        - name: x64
          apt_packages: "g++ build-essential make"
          cc: gcc
          cxx: g++
          triplet: x64-linux
          dll_sfx: linux.amd64
          path: ""
        - name: i386
          apt_packages: "g++-i686-linux-gnu"
          cc: i686-linux-gnu-gcc
          cxx: i686-linux-gnu-g++
          triplet: x86-linux
          dll_sfx: linux.i386
          path: /usr/i686-linux-gnu
        - name: aarch64
          apt_packages: "g++-aarch64-linux-gnu"
          cc: aarch64-linux-gnu-gcc
          cxx: aarch64-linux-gnu-g++
          triplet: arm64-linux
          dll_sfx: linux.aarch64
          path: /usr/aarch64-linux-gnu
        - name: arm
          apt_packages: "g++-arm-linux-gnueabihf"
          cc: arm-linux-gnueabihf-gcc
          cxx: arm-linux-gnueabihf-g++
          triplet: arm-linux
          dll_sfx: linux.arm
          path: /usr/arm-linux-gnueabihf
  
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: recursive
  
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }} autoconf automake
  
      - name: Create Build Directory
        run: cmake -E make_directory ${{github.workspace}}/build
  
      - name: Cache Vcpkg
        uses: actions/cache@v3
        id: cache
        with:
          path: ${{github.workspace}}/vcpkg/vcpkg
          key: ${{ runner.os }}-${{ matrix.triplet }}-20240520
  
      - name: Bootstrap Vcpkg
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: ${{github.workspace}}/vcpkg
        run: ./bootstrap-vcpkg.sh
  
      - name: Configure CMake
        shell: bash
        working-directory: ${{github.workspace}}/build
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake $GITHUB_WORKSPACE \
            -DCMAKE_BUILD_TYPE=$BUILD_TYPE \
            -DDLL_SUFFIX=.${{matrix.dll_sfx}} \
            -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/triplets \
            -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DCMAKE_PREFIX_PATH=${{ matrix.path }}
  
      - name: Build Project
        working-directory: ${{github.workspace}}/build
        run: cmake --build . --config $BUILD_TYPE
  
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triplet }}
          path: "**/w4123.Dice.${{ matrix.dll_sfx }}.dll"
